name: CD — Build, Tag, Push Image

# Only triggers on pushes to main — not on PRs, not on feature branches
# This means: code only gets published when it's been reviewed and merged
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build → Tag → Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Buildx with layer caching — production builds reuse CI cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to Docker Hub using secrets — never hardcoded
      # secrets.DOCKERHUB_USERNAME and secrets.DOCKERHUB_TOKEN come from
      # GitHub repo Settings → Secrets → Actions
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract metadata for intelligent, automatic image tagging
      # This generates multiple tags for the same image:
      # - sha-a1b2c3d  ← unique per commit (audit trail, rollback target)
      # - main         ← latest build from main branch
      # - latest       ← conventional "most recent stable" tag
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/yelpcamp
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=true

      # Build the production image AND push to Docker Hub
      # Uses the tags generated by metadata-action above
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Print the digest — a content-addressable hash of the image
      # This is more reliable than a tag for knowing EXACTLY what got deployed
      # Tags can be overwritten (latest). Digests cannot.
      - name: Print image digest
        run: echo "Image pushed with digest ${{ steps.build-and-push.outputs.digest }}"